name: Build FODHelperUACBypass_NG

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore -r win-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: FODHelperUACBypass_NG-Release
        path: FODHelperUACBypass_NG/bin/Release/net8.0/win-x64/*.exe
